---
- name: Verify common, per-kind, and guest-specific defaults precedence
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    guest_defaults:
      all:
        bridge: vmbr0
        datastore_id: common-pool
        cores: 2
        memory: 1024
      lxc:
        datastore_id: lxc-pool
        memory: 2048
      vm:
        memory: 4096
        disk_size: 32
  tasks:
    - name: Resolve LXC guest with explicit memory and no hostname
      ansible.builtin.include_role:
        name: mwyau.proxmox_community_scripts.application
        tasks_from: resolve_settings
      vars:
        kind: lxc
        settings:
          memory: 3072
          vlan_id: 42

    - name: Verify explicit values override LXC and global user defaults
      ansible.builtin.assert:
        that:
          - _cs_effective_settings.cores == 2
          - _cs_effective_settings.memory == 3072
          - _cs_effective_settings.datastore_id == 'lxc-pool'
          - _cs_effective_settings.bridge == 'vmbr0'
          - _cs_effective_settings.vlan_id == 42
          - "'hostname' not in _cs_effective_settings"
          - "'disk_size' not in _cs_effective_settings"

    - name: Resolve VM using no guest overrides
      ansible.builtin.include_role:
        name: mwyau.proxmox_community_scripts.application
        tasks_from: resolve_settings
      vars:
        kind: vm
        settings: {}

    - name: Verify VM-kind defaults override common but preserve omissions
      ansible.builtin.assert:
        that:
          - _cs_effective_settings.cores == 2
          - _cs_effective_settings.memory == 4096
          - _cs_effective_settings.datastore_id == 'common-pool'
          - _cs_effective_settings.bridge == 'vmbr0'
          - _cs_effective_settings.disk_size == 32
          - "'hostname' not in _cs_effective_settings"

    - name: Resolve VM with no user-defined defaults
      ansible.builtin.include_role:
        name: mwyau.proxmox_community_scripts.application
        tasks_from: resolve_settings
      vars:
        kind: vm
        guest_defaults: {}
        settings: {}

    - name: Verify an omitted value remains absent for upstream Core defaults
      ansible.builtin.assert:
        that:
          - _cs_effective_settings == {}
