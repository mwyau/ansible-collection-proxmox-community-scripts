name: Upstream script compatibility

on:
  pull_request:
  workflow_dispatch:
    inputs:
      kind:
        description: Script type
        type: choice
        required: true
        default: all
        options: [all, lxc, vm]
      slug:
        description: Optional single script slug
        type: string
        required: false
      upstream_ref:
        description: Upstream scripts Git revision
        type: string
        default: main
        required: true
  schedule:
    - cron: '21 5 * * 1'

permissions:
  contents: read

jobs:
  static-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      KIND: ${{ inputs.kind || 'all' }}
      SLUG: ${{ inputs.slug || '' }}
      UPSTREAM_REF: ${{ inputs.upstream_ref || 'main' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate untrusted workflow inputs
        shell: bash
        run: |
          python - <<'PY'
          import os, re
          kind, slug, ref = (os.environ[k] for k in ('KIND', 'SLUG', 'UPSTREAM_REF'))
          assert kind in ('all', 'lxc', 'vm')
          assert not slug or re.fullmatch(r'[a-z0-9][a-z0-9-]*', slug)
          assert re.fullmatch(r'[A-Za-z0-9._/-]+', ref) and '..' not in ref
          PY
      - name: Clone upstream repositories for syntax checks only
        shell: bash
        run: |
          git clone --quiet --depth 1 https://github.com/community-scripts/ProxmoxVE.git upstream-scripts
          git clone --quiet --depth 1 https://github.com/community-scripts/core.git upstream-core
          if [[ "$UPSTREAM_REF" != main ]]; then
            git -C upstream-scripts fetch --quiet --depth 1 origin "$UPSTREAM_REF"
            git -C upstream-scripts checkout --quiet --detach FETCH_HEAD
          fi
          echo "SCRIPT_SHA=$(git -C upstream-scripts rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "CORE_SHA=$(git -C upstream-core rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify normalized LXC and VM variables against actual upstream Core
        shell: bash
        run: |
          python -m scripts.verify_core_mapping --core upstream-core > core-variable-contract.json
          cat core-variable-contract.json >> "$GITHUB_STEP_SUMMARY"
      - name: Analyze shell syntax and possible unattended paths
        shell: bash
        run: |
          args=(--source upstream-scripts --core upstream-core --kind "$KIND"
                --scripts-rev "$SCRIPT_SHA" --core-rev "$CORE_SHA" --output out)
          if [[ -n "$SLUG" ]]; then args+=(--script "$SLUG"); fi
          python scripts/scan_community_scripts.py "${args[@]}" --strict-syntax
          cat out/compatibility.md >> "$GITHUB_STEP_SUMMARY"
      - name: Print nonstandard and prompt-classification evidence
        run: |
          python - <<'PY'
          import collections, json
          d=json.load(open("out/compatibility.json"))
          for r in d["scripts"]:
            if r["assessment"] == "custom_entrypoint":
              print("NONSTANDARD",json.dumps(r,sort_keys=True))
          print("PROMPT_GROUP_COUNTS",dict(collections.Counter(r["assessment"] for r in d["scripts"])))
          for r in d["scripts"]:
            if r.get("prompt_sites"):
              phases=r.get("prompt_phase_counts",{})
              flagged=[x for x in r["prompt_sites"] if x["near_function"].startswith(("update","advanced")) is False]
              print("PROMPTED",r["kind"],r["slug"],r["assessment"],"phases",phases,"flags",r["flags"],
                    "nonupdate",json.dumps(flagged[:4]))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: upstream-compatibility
          path: |
            out/
            core-variable-contract.json
          if-no-files-found: warn
          retention-days: 30
